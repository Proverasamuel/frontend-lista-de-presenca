<header class="bg-primary-700 text-white shadow-lg">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <!-- 🔹 Logo e Título -->
    <div class="flex items-center space-x-2">
      <i class="fas fa-graduation-cap text-xl"></i>
      <h1 class="text-2xl font-bold tracking-tight">Sistema Delegado</h1>
    </div>

    <!-- 🔹 Navegação -->
    <nav class="flex items-center space-x-6">
      <a
        routerLink="/dashboard"
        routerLinkActive="border-b-2 border-white font-semibold"
        class="py-2 px-1 transition-all duration-200 hover:text-primary-200"
      >
        Dashboard
      </a>

      <a
        routerLink="/aulas"
        routerLinkActive="border-b-2 border-white font-semibold"
        class="py-2 px-1 transition-all duration-200 hover:text-primary-200"
      >
        Gestão de Aulas
      </a>

      <!-- 🔹 Botão Logout -->
      <button
        (click)="logout()"
        class="flex items-center bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors duration-200"
      >
        <i class="fas fa-sign-out-alt mr-2"></i> Sair
      </button>
    </nav>
  </div>
</header>
