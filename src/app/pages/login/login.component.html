<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full animate-fade-in">
    <!-- Card Principal -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <!-- Header com Gradiente -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 text-center">
        <div class="flex justify-center mb-4">
          <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-sm">
            <i class="fas fa-graduation-cap text-white text-2xl"></i>
          </div>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Sistema Delegado</h1>
        <p class="text-blue-100 text-lg">Acesse sua conta</p>
      </div>

      <!-- Formulário -->
      <div class="p-8">
        <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-6">
          <!-- Campo Email -->
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">
              <i class="fas fa-envelope mr-2 text-blue-500"></i>
              Email
            </label>
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              email
              placeholder="seu.email@exemplo.com"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
              [class.border-red-500]="submitted && loginForm.controls['email'].invalid"
            >
            <div *ngIf="submitted && loginForm.controls['email']?.invalid" class="text-red-500 text-sm flex items-center">
              <i class="fas fa-exclamation-circle mr-2"></i>
              Por favor, insira um email válido
            </div>
          </div>

          <!-- Campo Senha -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <label for="password" class="block text-sm font-medium text-gray-700">
                <i class="fas fa-lock mr-2 text-blue-500"></i>
                Senha
              </label>
              <a href="#" class="text-sm text-blue-600 hover:text-blue-700 transition-colors">
                Esqueceu a senha?
              </a>
            </div>
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                [(ngModel)]="password"
                required
                placeholder="Sua senha"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                [class.border-red-500]="submitted && loginForm.controls['password'].invalid"
              >
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 transition-colors"
              >
                <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
              </button>
            </div>
            <div *ngIf="submitted && loginForm.controls['password']?.invalid" class="text-red-500 text-sm flex items-center">
              <i class="fas fa-exclamation-circle mr-2"></i>
              A senha é obrigatória
            </div>
          </div>

          <!-- Checkbox Lembrar-me -->
          <div class="flex items-center">
            <input
              id="remember"
              type="checkbox"
              [(ngModel)]="rememberMe"
              name="remember"
              class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
            >
            <label for="remember" class="ml-2 text-sm text-gray-700">
              Lembrar-me
            </label>
          </div>

          <!-- Botão de Login -->
          <button
            type="submit"
            [disabled]="loading"
            class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-3 px-4 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-800 focus:ring-4 focus:ring-blue-200 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
          >
            <i class="fas" [class.fa-spinner]="loading" [class.fa-sign-in-alt]="!loading" [class.animate-spin]="loading" class="mr-2"></i>
            {{ loading ? 'Entrando...' : 'Entrar na Conta' }}
          </button>

          <!-- Mensagem de Erro -->
          <div
            *ngIf="error"
            class="bg-red-50 border border-red-200 rounded-lg p-4 animate-shake"
          >
            <div class="flex items-center">
              <i class="fas fa-exclamation-triangle text-red-500 mr-3"></i>
              <div>
                <h3 class="font-medium text-red-800">Erro no login</h3>
                <p class="text-red-700 text-sm mt-1">{{ error }}</p>
              </div>
            </div>
          </div>

          <!-- Divisor -->
          <!-- <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500">Ou continue com</span>
            </div>
          </div> -->

          <!-- Login Social -->
         <!--  <div class="grid grid-cols-2 gap-3">
            <button
              type="button"
              (click)="socialLogin('google')"
              class="flex items-center justify-center p-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >
              <i class="fab fa-google text-red-500 mr-2"></i>
              <span class="text-sm font-medium">Google</span>
            </button>
            <button
              type="button"
              (click)="socialLogin('microsoft')"
              class="flex items-center justify-center p-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >
              <i class="fab fa-microsoft text-blue-500 mr-2"></i>
              <span class="text-sm font-medium">Microsoft</span>
            </button>
          </div> -->
        </form>

      </div>
    </div>

    <!-- Rodapé da Página -->
    <div class="text-center mt-6">
      <p class="text-gray-500 text-sm">
        &copy; {{ currentYear }} Atlas Digital. Todos os direitos reservados.
      </p>
      <p class="text-gray-400 text-xs mt-1">
        Sistema de gestão acadêmica - v1.0
      </p>
    </div>
  </div>
</div>
